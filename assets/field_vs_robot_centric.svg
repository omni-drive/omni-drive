<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

    <defs>
      <!-- Shadow filter -->
      <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
      </filter>
      
      <!-- Arrow markers -->
      <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
      </marker>
      <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
      </marker>
      <marker id="arrow-traj" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
      </marker>
    </defs>
    
<rect width="960" height="500" fill="#f8fafc" rx="16"/>

    <g transform="translate(480, 36)" text-anchor="middle">
      <text font-size="20" font-weight="700" fill="#0f172a">Wpływ układu odniesienia na ruch złożony (jazda + obrót)</text>
      <text y="22" font-size="13" font-weight="500" fill="#64748b">DriveVector(velocity=0.4 m/s, heading=0°, omega=0.5 rad/s)</text>
    </g>
    

    <!-- Left Card -->
    <rect x="32" y="78" width="432" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    
