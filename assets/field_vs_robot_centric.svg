    <g transform="translate(56, 110)">
      <rect x="0" y="-18" width="168" height="26" rx="6" fill="#ecfdf5"/>
      <text x="8" y="0" font-size="12" font-weight="700" fill="#059669">robot.field_centric = True</text>
      <text x="0" y="24" font-size="15" font-weight="700" fill="#0f172a">Tryb Field-Centric (Układ świata)</text>
      <text x="0" y="42" font-size="12" fill="#64748b">Wektor prędkości 0° zadany w pokoju (stały kierunek).</text>
    </g>
    

    <!-- Subtle Grid -->
