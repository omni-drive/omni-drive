<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <!-- Arrow marker for laser beams -->
    <marker id="arrow-beam" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e11d48" />
    </marker>
    <!-- Arrow marker for displacement vectors (orange) -->
    <marker id="arrow-disp-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#ea580c" />
    </marker>
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background / Floor -->
  <rect width="420" height="420" fill="#f8fafc" rx="8" />

  <!-- Grid lines inside arena -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="125" y1="50" x2="125" y2="350" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="275" y1="50" x2="275" y2="350" />
    <line x1="50" y1="125" x2="350" y2="125" />
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="50" y1="275" x2="350" y2="275" />
  </g>

  <!-- Arena Walls (Pudło 1m x 1m) -->
  <rect x="44" y="44" width="312" height="312" fill="none" stroke="#334155" stroke-width="12" rx="4" />

  <!-- Ghost of start position -->
  <g opacity="0.35">
    <circle cx="200" cy="200" r="28" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="200" cy="200" r="3" fill="#94a3b8" />
    <text x="216" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">start</text>
  </g>

  <!-- Laser Beams from current robot pose -->
  <!-- Front Beam -->
  <line x1="145" y1="135" x2="145" y2="56" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-beam)" />
  <!-- Left Beam -->
  <line x1="145" y1="135" x2="56" y2="135" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-beam)" />
  <!-- Right Beam -->
  <line x1="145" y1="135" x2="344" y2="135" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-beam)" />

  <!-- Laser Beam Badges (f, l, r) -->
  <!-- Front badge -->
  <g transform="translate(153, 80.5)">
    <rect width="32" height="24" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)" />
    <text x="16" y="16" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" font-style="italic" fill="#e11d48">f</text>
  </g>
  <!-- Left badge -->
  <g transform="translate(81.5, 105)">
    <rect width="32" height="24" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)" />
    <text x="16" y="16" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" font-style="italic" fill="#e11d48">l</text>
  </g>
  <!-- Right badge -->
  <g transform="translate(231.5, 105)">
    <rect width="32" height="24" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)" />
    <text x="16" y="16" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" font-style="italic" fill="#e11d48">r</text>
  </g>

  <!-- Robot Body -->
  <g transform="translate(145, 135)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="#f1f5f9" stroke="#334155" stroke-width="2.5" />
    
    <!-- 3 Omni Wheels -->
    <rect x="-10" y="22" width="20" height="7" rx="2" fill="#0f172a" />
    <g transform="rotate(-60)">
      <rect x="-10" y="-29" width="20" height="7" rx="2" fill="#0f172a" />
    </g>
    <g transform="rotate(60)">
      <rect x="-10" y="-29" width="20" height="7" rx="2" fill="#0f172a" />
    </g>

    <!-- Front heading indicator -->
    <polygon points="0,-24 -6,-14 6,-14" fill="#0284c7" />

    <!-- LiDAR module -->
    <circle cx="0" cy="0" r="11" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Displacement vectors: ORANGE and LAYERED ON TOP OF ROBOT -->
  <!-- Vector y: from start_x left to robot_x at start_y -->
  <line x1="200" y1="200" x2="150" y2="200" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-disp-orange)" />

  <!-- Vector x: from start_y UP to the center of robot (robot_y) -->
  <line x1="145" y1="200" x2="145" y2="139" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-disp-orange)" />

  <!-- Corner projection dot at (robot_x, start_y) -->
  <circle cx="145" cy="200" r="2.5" fill="#ea580c" />

  <!-- Displacement badges (y, x) in ORANGE -->
  <!-- y badge (horizontal vector) -->
  <g transform="translate(160.5, 208)">
    <rect width="24" height="22" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)" />
    <text x="12" y="15" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" font-style="italic" fill="#ea580c">y</text>
  </g>

  <!-- x badge (vertical vector) -->
  <g transform="translate(113, 156.5)">
    <rect width="24" height="22" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)" />
    <text x="12" y="15" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" font-style="italic" fill="#ea580c">x</text>
  </g>

  <!-- Title / Legend at bottom -->
  <text x="200" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">
    Po przesunięciu
  </text>
</svg>
