<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 15 520 440" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-green-main" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
    <marker id="arr-green-comp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
      <marker id="arr-arc-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="70" y="15" width="520" height="440" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Chassis circle -->
  <circle cx="330" cy="235" r="145" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/>

  <!-- Axes -->
  <line x1="330" y1="235" x2="330" y2="35" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-axis)"/>
  <text x="342" y="40" font-size="13" font-weight="700" fill="#0f172a">x (przód)</text>
  <line x1="330" y1="235" x2="140" y2="235" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-axis)"/>
  <text x="145" y="255" font-size="13" font-weight="700" fill="#0f172a">y (lewo)</text>

  <!-- Motor Arms -->
  <line x1="330" y1="235" x2="204.4" y2="162.5" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="330" y1="235" x2="204.4" y2="162.5" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="235" x2="330.0" y2="380.0" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="330" y1="235" x2="330.0" y2="380.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="235" x2="455.6" y2="162.5" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="330" y1="235" x2="455.6" y2="162.5" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Two 60° arcs from axis x to Wheel 1 and Wheel 3 -->
  <!-- Two 60° arcs from axis x to Wheel 1 and Wheel 3 -->
  <!-- Left arc (to Wheel 1) -->
  <path d="M 330 183 A 52 52 0 0 0 285.0 209.0" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-arc-blue)"/>
  <text x="296" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">60°</text>

  <!-- Right arc (to Wheel 3) -->
  <path d="M 330 183 A 52 52 0 0 1 375.0 209.0" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-arc-blue)"/>
  <text x="364" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">60°</text>

  <!-- ================= WHEEL 1 ================= -->
  <!-- 60° Angle Sector & Arc -->
  <path d="M 204.4 162.5 L 166.4 162.5 A 38.0 38.0 0 0 0 185.4 195.4 Z" fill="#22c55e" fill-opacity="0.14"/>
  <path d="M 166.4 162.5 A 38.0 38.0 0 0 0 185.4 195.4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <!-- Components and vector -->
  <line x1="163.4" y1="233.5" x2="204.4" y2="233.5" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="163.4" y1="233.5" x2="163.4" y2="162.5" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="204.4" y1="162.5" x2="204.4" y2="233.5" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green-comp)"/>
  <line x1="204.4" y1="162.5" x2="163.4" y2="162.5" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green-comp)"/>
  <line x1="204.4" y1="162.5" x2="163.4" y2="233.5" stroke="#15803d" stroke-width="3.8" stroke-linecap="round" marker-end="url(#arr-green-main)"/>
  <text x="177.5" y="173.5" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" text-anchor="middle">60°</text>
  <text x="177.5" y="173.5" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">60°</text>
  <text x="136.0" y="208.0" text-anchor="start" font-size="15" font-weight="700" font-style="italic" fill="#15803d">w<tspan dy="3" font-size="11">1</tspan></text>

  <!-- ================= WHEEL 2 ================= -->
  <!-- Wheel 2 vector (purely horizontal to the right) -->
  <line x1="330.0" y1="380.0" x2="412.0" y2="380.0" stroke="#15803d" stroke-width="3.8" stroke-linecap="round" marker-end="url(#arr-green-main)"/>
  <text x="420.0" y="375.0" text-anchor="start" font-size="15" font-weight="700" font-style="italic" fill="#15803d">w<tspan dy="3" font-size="11">2</tspan></text>
  <!-- Guide dashed line showing axis alignment -->
  <line x1="280.0" y1="380.0" x2="330.0" y2="380.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- ================= WHEEL 3 ================= -->
  <!-- 60° Angle Sector & Arc -->
  <path d="M 455.6 162.5 L 417.6 162.5 A 38.0 38.0 0 0 1 436.6 129.6 Z" fill="#22c55e" fill-opacity="0.14"/>
  <path d="M 417.6 162.5 A 38.0 38.0 0 0 1 436.6 129.6" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <!-- Components and vector -->
  <line x1="414.6" y1="91.5" x2="414.6" y2="162.5" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="414.6" y1="91.5" x2="455.6" y2="91.5" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="455.6" y1="162.5" x2="455.6" y2="91.5" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green-comp)"/>
  <line x1="455.6" y1="162.5" x2="414.6" y2="162.5" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green-comp)"/>
  <line x1="455.6" y1="162.5" x2="414.6" y2="91.5" stroke="#15803d" stroke-width="3.8" stroke-linecap="round" marker-end="url(#arr-green-main)"/>
  <text x="431.0" y="151.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" text-anchor="middle">60°</text>
  <text x="431.0" y="151.0" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">60°</text>
  <text x="382.0" y="82.0" text-anchor="start" font-size="15" font-weight="700" font-style="italic" fill="#15803d">w<tspan dy="3" font-size="11">3</tspan></text>

  <!-- Physical Rollers -->
  <g transform="translate(204.4, 162.5) rotate(-60.0)">
    <rect x="-27" y="-8" width="54" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="9" y1="-8" x2="9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="18" y1="-8" x2="18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
  </g>
  <g transform="translate(330.0, 380.0) rotate(180.0)">
    <rect x="-27" y="-8" width="54" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="9" y1="-8" x2="9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="18" y1="-8" x2="18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
  </g>
  <g transform="translate(455.6, 162.5) rotate(60.0)">
    <rect x="-27" y="-8" width="54" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="9" y1="-8" x2="9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="18" y1="-8" x2="18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
  </g>

  <!-- Center Hub -->
  <circle cx="330" cy="235" r="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <circle cx="330" cy="235" r="4" fill="#f8fafc"/>

  <!-- Labels -->
  <text x="182.4" y="134.5" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Koło 1</text>
  <text x="182.4" y="150.5" text-anchor="end" font-size="11.5" font-weight="600" fill="#64748b">przednie lewe</text>

  <text x="330" y="406.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Koło 2</text>
  <text x="330" y="422.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">tylne</text>

  <text x="477.6" y="144.5" font-size="13" font-weight="700" fill="#0f172a">Koło 3</text>
  <text x="477.6" y="160.5" font-size="11.5" font-weight="600" fill="#64748b">przednie prawe</text>
</svg>