  <line x1="330" y1="235" x2="140" y2="235" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-axis)"/>
  <text x="145" y="255" font-size="13" font-weight="700" fill="#0f172a">y (lewo)</text>
