  <line x1="330.0" y1="380.0" x2="412.0" y2="380.0" stroke="#15803d" stroke-width="3.2" stroke-dasharray="5 4" marker-end="url(#arr-green-main)"/>
  <line x1="455.6" y1="162.5" x2="414.6" y2="91.5" stroke="#15803d" stroke-width="3.2" stroke-dasharray="5 4" marker-end="url(#arr-green-main)"/>
