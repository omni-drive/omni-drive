    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="9" y1="-8" x2="9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="18" y1="-8" x2="18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
  </g>
  <g transform="translate(330.0, 380.0) rotate(180.0)">
    <rect x="-27" y="-8" width="54" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="9" y1="-8" x2="9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="18" y1="-8" x2="18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
  </g>
  <g transform="translate(455.6, 162.5) rotate(60.0)">
    <rect x="-27" y="-8" width="54" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="9" y1="-8" x2="9" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="18" y1="-8" x2="18" y2="8" stroke="#94a3b8" stroke-width="1.8"/>
  </g>
  <!-- Robot motion vector and decomposition -->
  <line x1="360.9" y1="59.7" x2="330.0" y2="59.7" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="360.9" y1="59.7" x2="360.9" y2="235.0" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="330" y1="235" x2="330.0" y2="59.7" stroke="#ef4444" stroke-width="2.8" marker-end="url(#arr-red-comp)"/>
  <line x1="330" y1="235" x2="360.9" y2="235.0" stroke="#ef4444" stroke-width="2.8" marker-end="url(#arr-red-comp)"/>
  <line x1="330" y1="235" x2="360.9" y2="59.7" stroke="#dc2626" stroke-width="4.2" marker-end="url(#arr-red-main)"/>
  <text x="372" y="68" text-anchor="start" font-size="16" font-weight="700" font-style="italic" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">v</text>
  <text x="372" y="68" text-anchor="start" font-size="16" font-weight="700" font-style="italic" fill="#dc2626">v</text>
  <text x="322.0" y="135.0" text-anchor="end" font-size="14" font-weight="700" font-style="italic" fill="#dc2626">v<tspan dy="3" font-size="10.5">x</tspan></text>
  <text x="349.5" y="253.0" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#dc2626">v<tspan dy="3" font-size="10.5">y</tspan></text>
  <!-- Center Hub -->
  <circle cx="330" cy="235" r="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <circle cx="330" cy="235" r="4" fill="#f8fafc"/>
  <!-- Labels -->
  <text x="182.4" y="134.5" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Koło 1</text>
  <text x="182.4" y="150.5" text-anchor="end" font-size="11.5" font-weight="600" fill="#2563eb">przednie lewe</text>
  <text x="330" y="406.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Koło 2</text>
  <text x="330" y="422.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">tylne</text>
  <text x="477.6" y="144.5" font-size="13" font-weight="700" fill="#0f172a">Koło 3</text>
  <text x="477.6" y="160.5" font-size="11.5" font-weight="600" fill="#475569">przednie prawe</text>
