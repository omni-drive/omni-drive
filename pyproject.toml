[project]
name = "omni-drive-demo"
version = "0.1.0"
description = "Examples and public demo using the omni-drive library"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "bokeh==3.9.0",
    "jupyter-bokeh==4.0.5",
    "notebook==7.5.7",
    "omni-drive",
    "pandas>=2.2.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.uv.sources]
omni-drive = { url = "https://github.com/omni-drive/omni-drive/releases/download/v0.1.3/omni_drive-0.1.3-py3-none-any.whl" }

