[project]
name = "omni-drive"
version = "0.1.0"
description = "Python library and simulator for a three-wheel omnidirectional robot"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "bokeh==3.9.0",
    "jupyter-bokeh==4.0.5",
    "numpy>=2.2.4",
    "pandas>=2.2.0",
    "protobuf==7.35.1",
    "pyzmq>=25.1.2",
    "scipy>=1.13.1",
]

[project.urls]
Documentation = "https://omni-drive.readthedocs.io/"
Source = "https://github.com/omni-drive/omni-drive"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=9.1.1",
    "ruff>=0.15.15",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/generated"]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["docs/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_drive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
