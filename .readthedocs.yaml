# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
# The docs dependencies live in the `docs` group of lab/pyproject.toml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --project lab --locked --only-group docs

mkdocs:
  configuration: docs/mkdocs.yml
  fail_on_warning: true
