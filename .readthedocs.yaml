# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: docs/mkdocs.yml
  fail_on_warning: true
